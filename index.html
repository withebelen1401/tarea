<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Programador Comelón NY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #d4e9f7 100%);
            color: #1a3a4a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            background: rgba(220, 240, 250, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 60px rgba(50, 150, 200, 0.2), 0 0 40px rgba(100, 200, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        /* PANTALLA INICIAL */
        .screen {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* INICIO */
        .start-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
            justify-content: center;
            min-height: 450px;
        }

        .game-title {
            font-size: 2.8em;
            font-weight: 900;
            background: linear-gradient(135deg, #0099cc 0%, #00ccff 50%, #00ddff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 150, 200, 0.3);
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite;
            margin-bottom: 15px;
        }

        @keyframes glow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(0, 150, 200, 0.2));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(0, 150, 200, 0.4));
            }
        }

        .subtitle {
            font-size: 1em;
            color: #0088bb;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 350px;
        }

        label {
            text-align: left;
            font-size: 0.95em;
            color: #0066aa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        select {
            padding: 12px 15px;
            border: 2px solid #0099cc;
            background: rgba(200, 235, 255, 0.5);
            color: #1a3a4a;
            border-radius: 10px;
            font-size: 0.95em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #0077aa;
            background: rgba(150, 220, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 150, 200, 0.3);
        }

        input[type="text"]::placeholder {
            color: rgba(0, 100, 150, 0.5);
        }

        select option {
            background: #e8f4f8;
            color: #1a3a4a;
        }

        .button {
            padding: 12px 30px;
            border: none;
            background: linear-gradient(135deg, #0099cc 0%, #0077aa 100%);
            color: #ffffff;
            font-size: 1em;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(0, 150, 200, 0.3);
            margin-top: 15px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 150, 200, 0.4);
        }

        .button:active {
            transform: translateY(0px);
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* PANTALLA DEL JUEGO */
        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            min-height: 550px;
        }

        .game-left {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .canvas-container {
            background: rgba(200, 235, 255, 0.6);
            border: 2px solid #0099cc;
            border-radius: 15px;
            padding: 8px;
            box-shadow: 0 0 15px rgba(0, 150, 200, 0.15);
        }

        canvas {
            display: block;
            background: #f0f8fc;
            border-radius: 10px;
            width: 100%;
            height: auto;
        }

        .game-info-mini {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85em;
        }

        .info-box-mini {
            background: rgba(100, 200, 255, 0.2);
            border: 1px solid #0099cc;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }

        .info-label-mini {
            color: #0066aa;
            font-size: 0.75em;
            text-transform: uppercase;
        }

        .info-value-mini {
            font-size: 1.1em;
            font-weight: 700;
            color: #0044aa;
        }

        .game-middle {
            background: rgba(200, 235, 255, 0.4);
            border: 2px solid #0099cc;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            max-height: 550px;
        }

        .player-info {
            text-align: center;
            border-bottom: 2px solid rgba(0, 150, 200, 0.2);
            padding-bottom: 12px;
        }

        .player-name {
            font-size: 1.2em;
            font-weight: 700;
            color: #0077aa;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-item {
            background: rgba(100, 200, 255, 0.15);
            border: 1px solid #0099cc;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(100, 200, 255, 0.25);
            border-color: #0077aa;
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 0.65em;
            color: #0066aa;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: 700;
            color: #0044aa;
        }

        .question-section {
            flex: 1;
        }

        .question-header {
            font-size: 0.8em;
            color: #0066aa;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .topic-badge {
            display: inline-block;
            background: linear-gradient(135deg, #0099cc 0%, #0077aa 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .question-text {
            font-size: 0.95em;
            font-weight: 600;
            color: #1a3a4a;
            margin-bottom: 12px;
            line-height: 1.4;
            background: rgba(100, 200, 255, 0.15);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #0099cc;
        }

        .answers-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .answer-button {
            padding: 10px 12px;
            border: 2px solid #0099cc;
            background: rgba(150, 220, 255, 0.3);
            color: #1a3a4a;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 0.9em;
            font-weight: 500;
        }

        .answer-button:hover:not(:disabled) {
            background: rgba(100, 200, 255, 0.4);
            border-color: #0077aa;
            transform: translateX(3px);
        }

        .answer-button:disabled {
            cursor: not-allowed;
        }

        .answer-button.correct {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4caf50;
            color: #2e7d32;
        }

        .answer-button.incorrect {
            background: rgba(244, 67, 54, 0.3);
            border-color: #f44336;
            color: #c62828;
        }

        .feedback {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9em;
            line-height: 1.4;
            margin-top: 8px;
            display: none;
        }

        .feedback.show {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback.correct-feedback {
            background: rgba(76, 175, 80, 0.2);
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }

        .feedback.incorrect-feedback {
            background: rgba(244, 67, 54, 0.2);
            border-left: 4px solid #f44336;
            color: #c62828;
        }

        .next-button {
            padding: 10px 15px;
            background: linear-gradient(135deg, #0099cc 0%, #0077aa 100%);
            border: none;
            color: #ffffff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            margin-top: 8px;
            display: none;
            transition: all 0.3s ease;
        }

        .next-button.show {
            display: block;
        }

        .next-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 150, 200, 0.3);
        }

        /* PANEL DE TEORÍA */
        .game-right {
            background: rgba(200, 235, 255, 0.4);
            border: 2px solid #0099cc;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            max-height: 550px;
        }

        .theory-header {
            font-size: 1em;
            color: #0066aa;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
            border-bottom: 2px solid rgba(0, 150, 200, 0.2);
            padding-bottom: 10px;
        }

        .theory-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .theory-item {
            background: rgba(100, 200, 255, 0.15);
            border-left: 4px solid #0099cc;
            padding: 12px;
            border-radius: 8px;
        }

        .theory-title {
            font-size: 0.95em;
            font-weight: 700;
            color: #0077aa;
            margin-bottom: 6px;
        }

        .theory-text {
            font-size: 0.85em;
            color: #1a3a4a;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .code-block {
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 150, 200, 0.2);
            padding: 8px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.8em;
            color: #0044aa;
            overflow-x: auto;
            margin-top: 6px;
        }

        /* GAME OVER */
        .game-over-screen {
            display: none;
            text-align: center;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            justify-content: center;
            min-height: 450px;
        }

        .game-over-screen.active {
            display: flex;
        }

        .game-over-title {
            font-size: 3.5em;
            font-weight: 900;
            color: #cc5500;
            text-shadow: 0 0 20px rgba(204, 85, 0, 0.3);
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .final-stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 1.1em;
            color: #0066aa;
            margin: 15px 0;
        }

        .final-stat {
            background: rgba(100, 200, 255, 0.15);
            padding: 12px 25px;
            border-radius: 10px;
            border-left: 4px solid #0099cc;
        }

        .final-stat strong {
            color: #1a3a4a;
        }

        .restart-button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            border: none;
            color: #ffffff;
            font-size: 1em;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            transition: all 0.3s ease;
        }

        .restart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.4);
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .game-screen.active {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .game-middle, .game-right {
                max-height: 400px;
            }

            .game-title {
                font-size: 2.2em;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .game-title {
                font-size: 1.8em;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .game-middle, .game-right {
                max-height: none;
            }
        }

        /* SCROLLBAR */
        .game-middle::-webkit-scrollbar,
        .game-right::-webkit-scrollbar {
            width: 6px;
        }

        .game-middle::-webkit-scrollbar-track,
        .game-right::-webkit-scrollbar-track {
            background: rgba(0, 150, 200, 0.1);
            border-radius: 10px;
        }

        .game-middle::-webkit-scrollbar-thumb,
        .game-right::-webkit-scrollbar-thumb {
            background: rgba(0, 150, 200, 0.3);
            border-radius: 10px;
        }

        .game-middle::-webkit-scrollbar-thumb:hover,
        .game-right::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 150, 200, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- PANTALLA DE INICIO -->
        <div class="screen start-screen active" id="startScreen">
            <h1 class="game-title">🎮 EL PROGRAMADOR COMELÓN NY</h1>
            <p class="subtitle">Aprende JavaScript jugando</p>

            <div class="form-group">
                <label for="playerName">Tu Nombre</label>
                <input type="text" id="playerName" placeholder="Escribe tu nombre...">

                <label for="difficulty">Dificultad</label>
                <select id="difficulty">
                    <option value="easy">Fácil</option>
                    <option value="medium">Medio</option>
                    <option value="hard">Difícil</option>
                </select>

                <button class="button" onclick="startGame()">JUGAR</button>
            </div>
        </div>

        <!-- PANTALLA DEL JUEGO -->
        <div class="screen game-screen" id="gameScreen">
            <div class="game-left">
                <div class="canvas-container">
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                </div>
                <div class="game-info-mini">
                    <div class="info-box-mini">
                        <div class="info-label-mini">Puntaje</div>
                        <div class="info-value-mini" id="scoreMini">0</div>
                    </div>
                    <div class="info-box-mini">
                        <div class="info-label-mini">Vidas</div>
                        <div class="info-value-mini" id="livesMini">3</div>
                    </div>
                    <div class="info-box-mini">
                        <div class="info-label-mini">Nivel</div>
                        <div class="info-value-mini" id="levelMini">1</div>
                    </div>
                    <div class="info-box-mini">
                        <div class="info-label-mini">Temas</div>
                        <div class="info-value-mini" id="questionsMini">0</div>
                    </div>
                </div>
            </div>

            <div class="game-middle">
                <div class="player-info">
                    <div class="player-name" id="playerDisplayName">Jugador</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-label">Puntaje</div>
                            <div class="stat-value" id="scoreDisplay">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Vidas</div>
                            <div class="stat-value" id="livesDisplay">3</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Nivel</div>
                            <div class="stat-value" id="levelDisplay">1</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Aciertos</div>
                            <div class="stat-value" id="correctDisplay">0</div>
                        </div>
                    </div>
                </div>

                <div class="question-section">
                    <div class="question-header" id="questionCount">Pregunta 1</div>
                    <div class="topic-badge" id="topicBadge">Variables</div>
                    <div class="question-text" id="questionText">Cargando pregunta...</div>
                    <div class="answers-container" id="answersContainer">
                        <!-- Se generan dinámicamente -->
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <button class="next-button" id="nextButton" onclick="nextQuestion()">Siguiente</button>
                </div>
            </div>

            <div class="game-right">
                <div class="theory-header">📚 Teoría del Tema</div>
                <div class="theory-content" id="theoryContent">
                    <!-- Se genera dinámicamente -->
                </div>
            </div>
        </div>

        <!-- PANTALLA GAME OVER -->
        <div class="screen game-over-screen" id="gameOverScreen">
            <h1 class="game-over-title">💀 GAME OVER</h1>
            <div class="final-stats">
                <div class="final-stat">Jugador: <strong id="finalPlayerName">Jugador</strong></div>
                <div class="final-stat">Puntaje Final: <strong id="finalScore">0</strong></div>
                <div class="final-stat">Respuestas Correctas: <strong id="finalCorrect">0</strong></div>
                <div class="final-stat">Temas Completados: <strong id="finalTopics">0</strong></div>
            </div>
            <button class="restart-button" onclick="restartGame()">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
